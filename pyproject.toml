[project]
name = "friction-cliff-bench"
version = "1.0.0"
description = "Feasibility-audited, parity-controlled benchmark of car control under sudden tire-road friction loss"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "optuna>=5.0.0",
    "warp-lang",
]

[dependency-groups]
dev = ["pytest", "matplotlib", "scipy"]
# The RL / estimator arm (P3). Kept out of the core so CPU-only CI stays light.
rl = ["torch"]

[tool.uv]
default-groups = ["dev", "rl"]

# PyTorch CUDA build for the RTX 5090 Laptop (sm_120): needs CUDA >= 12.8 wheels.
# cu130 matches the installed driver (580, CUDA 13.0).
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: long-running (minutes); run with -m slow",
    "gpu: needs a CUDA device; skipped automatically without one",
]
addopts = "-m 'not slow'"
